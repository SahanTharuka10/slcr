<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team registration – SLCRICKPRO</title>
  <meta name="theme-color" content="#080b14" />
  <link rel="icon" href="assets/icon.png" />
  <script>try{var t=localStorage.getItem('slc_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="css/site.css?v=4" />
  <style>
    .rg-player { display: grid; grid-template-columns: 64px 70px minmax(0, 1fr) 120px 36px; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .rg-photo { width: 64px; height: 64px; border-radius: 14px; background: var(--input) center/cover no-repeat; box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; cursor: pointer; font-size: 22px; color: var(--muted); }
    .rg-player input, .rg-player select { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--input); color: var(--text); width: 100%; }
    .rg-x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
    @media (max-width: 560px) { .rg-player { grid-template-columns: 56px 60px minmax(0, 1fr) 30px; } .rg-player select { grid-column: 2 / 4; } .rg-photo { width: 56px; height: 56px; grid-row: span 2; } }
  </style>
</head>
<body>
  <main class="s-wrap" style="max-width:860px">
    <div id="rg"><div class="s-empty">Loading…</div></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/site.js?v=2"></script>
  <script>
    SLC.header('');
    const esc = SLC.esc;
    const token = new URLSearchParams(location.search).get('token') || '';
    const root = document.getElementById('rg');
    let state = null;

    /** Shrink a photo to ≤ 320px so the whole squad uploads quickly. */
    function shrink(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 320;
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            let url = c.toDataURL('image/webp', 0.82);
            if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', 0.82);
            resolve(url);
          };
          img.onerror = () => reject(new Error('Not an image'));
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    function playerRow(p, i) {
      return `<div class="rg-player" data-i="${i}">
        <label class="rg-photo" style="${p.photo ? `background-image:url('${p.photo}')` : ''}" title="Add photo">${p.photo ? '' : '📷'}<input type="file" accept="image/*" hidden data-photo></label>
        <input data-k="no" inputmode="numeric" maxlength="4" placeholder="No." value="${esc(p.no)}">
        <input data-k="name" maxlength="40" placeholder="Player name" value="${esc(p.name)}">
        <select data-k="role">${['Batter', 'Bowler', 'All-rounder', 'Wicket-keeper', 'Captain'].map((r) => `<option ${p.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
        <button class="rg-x" data-rm title="Remove">✕</button>
      </div>`;
    }

    function render() {
      const s = state;
      root.innerHTML = `
        <div class="m-head"><span>🏆 ${esc(s.tournament.name)} · ${esc(s.tournament.overs)} overs</span></div>
        <h1 class="s-h1">Team registration</h1>
        <p class="s-sub">Add your players — number, name and a clear photo (face + shoulders). Photos are deleted when the tournament ends.</p>
        <div class="f-card">
          <label class="f-field"><span>Team name</span><input id="rg-team" maxlength="60" value="${esc(s.displayName || s.team)}"></label>
          <div class="f-field"><span>Players (${s.players.length}/25)</span><div id="rg-list">${s.players.map(playerRow).join('')}</div></div>
          <button class="s-btn" id="rg-add">＋ Add player</button>
          <div style="margin-top:18px"><button class="s-btn s-btn--primary s-btn--lg s-btn--block" id="rg-save">Save team</button></div>
        </div>`;
      document.getElementById('rg-add').onclick = () => {
        if (s.players.length >= 25) return SLC.toast('Maximum 25 players', 'error');
        s.players.push({ no: '', name: '', role: 'Batter', photo: '' });
        render();
        const rows = document.querySelectorAll('.rg-player');
        rows[rows.length - 1].querySelector('[data-k="name"]').focus();
      };
      document.getElementById('rg-list').addEventListener('input', (e) => {
        const row = e.target.closest('.rg-player');
        if (row && e.target.dataset.k) s.players[+row.dataset.i][e.target.dataset.k] = e.target.value;
      });
      document.getElementById('rg-list').addEventListener('change', async (e) => {
        const row = e.target.closest('.rg-player');
        if (!row) return;
        if (e.target.dataset.k) s.players[+row.dataset.i][e.target.dataset.k] = e.target.value;
        if (e.target.hasAttribute('data-photo') && e.target.files[0]) {
          try { s.players[+row.dataset.i].photo = await shrink(e.target.files[0]); render(); }
          catch (err) { SLC.toast(err.message, 'error'); }
        }
      });
      document.getElementById('rg-list').addEventListener('click', (e) => {
        if (!e.target.closest('[data-rm]')) return;
        s.players.splice(+e.target.closest('.rg-player').dataset.i, 1);
        render();
      });
      document.getElementById('rg-save').onclick = async () => {
        const players = s.players.filter((p) => p.name.trim());
        const btn = document.getElementById('rg-save');
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          await SLC.api(`/roster/${encodeURIComponent(token)}`, { method: 'PUT', body: { displayName: document.getElementById('rg-team').value, players } });
          SLC.toast(`✅ Saved ${players.length} players`);
        } catch (e) { SLC.toast(e.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Save team';
      };
    }

    SLC.api(`/roster/${encodeURIComponent(token)}`)
      .then((d) => {
        state = d;
        if (!state.players.length) state.players = Array.from({ length: Math.min(11, d.tournament.playersPerSide || 11) }, () => ({ no: '', name: '', role: 'Batter', photo: '' }));
        render();
      })
      .catch((e) => { root.innerHTML = `<div class="s-empty"><b>${e.status === 410 ? 'Tournament has ended' : 'Link not valid'}</b>${esc(e.message)}</div>`; });
  </script>
</body>
</html>
