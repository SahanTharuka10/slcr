<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Match – SLCRICKPRO</title>
  <meta name="theme-color" content="#080b14" />
  <link rel="icon" href="assets/icon.png" />
  <script>try{var t=localStorage.getItem('slc_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="css/site.css?v=4" />
</head>
<body>
  <main class="s-wrap" id="mp"><div class="s-empty">Loading match…</div></main>
  <script src="js/config.js"></script>
  <script src="js/site.js?v=2"></script>
  <script src="vendor/pdf/html2pdf.bundle.min.js" defer></script>
  <script>
    SLC.header('live');
    const id = new URLSearchParams(location.search).get('id');
    const root = document.getElementById('mp');
    let timer = null;
    let current = null;

    function render(m, view) {
      current = m;
      const esc = SLC.esc;
      const s1 = SLC.teamScore(m, m.team1);
      const s2 = SLC.teamScore(m, m.team2);
      const inn = (m.innings || [])[m.currentInnings || 0];
      const live = m.status === 'live' || m.status === 'paused';
      let now = '';
      if (live && inn) {
        const cbi = inn.currentBatsmenIdx || [];
        const bats = cbi.map((i) => inn.batsmen && inn.batsmen[i]).filter(Boolean);
        const bowler = inn.currentBowlerIdx != null ? inn.bowlers[inn.currentBowlerIdx] : null;
        const prev = m.innings[0];
        const chase = (m.currentInnings || 0) === 1 && prev
          ? (() => {
              const target = (prev.runs || 0) + 1;
              const left = Math.max(0, (m.overs || 20) * (m.ballsPerOver || 6) - (inn.balls || 0));
              return `<div class="mp-line">Need <b>${Math.max(0, target - inn.runs)}</b> from <b>${left}</b> balls · Target ${target}</div>`;
            })()
          : '';
        now = `<div class="mp-now">
          ${chase}
          <div class="m-row"><b>🏏 ${bats.map((b, k) => `${esc(b.name)}${cbi[inn.strikerIdx] === cbi[k] ? '*' : ''} ${b.runs}(${b.balls})`).join(' · ')}</b></div>
          ${bowler ? `<div class="m-row"><b>⚾ ${esc(bowler.name)} ${bowler.wickets}-${bowler.runs} (${SLC.overs(bowler.balls, m.ballsPerOver)})</b></div>` : ''}
          <div class="sc-balls"><span class="s-muted" style="font-size:12px;margin-right:4px">This over</span>${SLC.ballsHtml(inn.currentOver)}</div>
        </div>`;
      }
      document.title = `${m.team1} vs ${m.team2} – SLCRICKPRO`;
      root.innerHTML = `
        <div class="m-head" style="margin-bottom:10px"><span>${m.tournamentId ? `<a href="tournament.html?id=${encodeURIComponent(m.tournamentId)}">🏆 ${esc(m.tournamentName || 'Tournament')}</a>` : 'Single match'}${m.venue ? ` · 📍 ${esc(m.venue)}` : ''} · ${esc(m.overs)} overs</span>${SLC.statusTag(m.status)}</div>
        <section class="mp-hero">
          <div class="mp-teams">
            <div class="mp-team"><b>${esc(m.team1)}</b><strong>${s1.text || '—'}</strong><small>${esc(s1.sub)}</small></div>
            <div class="mp-vs">vs</div>
            <div class="mp-team"><b>${esc(m.team2)}</b><strong>${s2.text || '—'}</strong><small>${esc(s2.sub)}</small></div>
          </div>
          ${m.result ? `<div class="mp-line mp-line--result">🏆 ${esc(m.result)}</div>` : ''}
          ${m.tossWinner ? `<div class="mp-line s-muted" style="font-weight:600">${esc(m.tossWinner)} won the toss and chose to ${m.tossDecision === 'bowl' ? 'bowl' : 'bat'}</div>` : ''}
          ${now}
        </section>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button class="s-btn" id="mp-pdf">⬇ Summary PDF</button>
          <button class="s-btn" id="mp-share">🔗 Share</button>
          ${live ? '<span class="s-muted" style="align-self:center;font-size:13px">Auto-updating…</span>' : ''}
        </div>
        ${SLC.scorecardHtml(m)}`;
      document.getElementById('mp-pdf').onclick = () => SLC.downloadSummaryPdf(current);
      document.getElementById('mp-share').onclick = async () => {
        const data = { title: `${m.team1} vs ${m.team2}`, url: location.href };
        if (navigator.share) navigator.share(data).catch(() => {});
        else { await navigator.clipboard.writeText(location.href); SLC.toast('Link copied'); }
      };
      clearTimeout(timer);
      if (live) timer = setTimeout(load, 5000);
    }

    async function load() {
      if (!id) { root.innerHTML = '<div class="s-empty"><b>No match selected</b></div>'; return; }
      try {
        const { match, view } = await SLC.api(`/matches/${encodeURIComponent(id)}`);
        render(match, view);
      } catch (e) {
        if (current) { clearTimeout(timer); timer = setTimeout(load, 8000); return; }
        root.innerHTML = `<div class="s-empty"><b>Match not found</b>${SLC.esc(e.message)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
