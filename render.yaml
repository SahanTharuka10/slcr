services:
  - type: web
    name: slcrickpro-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: node server.js
    healthCheckPath: /api/ping
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
