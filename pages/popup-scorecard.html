<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=score-match.html" />
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      p.set('popupScore', '1');
      if (!p.get('matchId') && p.get('matchId') !== '') { /* keep */ }
      location.replace('score-match.html?' + p.toString());
    })();
  </script>
  <title>Redirecting…</title>
</head>
<body>
  <p>Opening popup score… <a href="score-match.html?popupScore=1">Click here</a></p>
</body>
</html>
