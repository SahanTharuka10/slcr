services:
  - type: web
    name: slcrickpro-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    # Dashboard must match: Start = node server.js | Branch = main | Root = (empty)
    startCommand: node render-api.js
    healthCheckPath: /api/ping
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
